<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D Marketing — NovaTrix Media (Stabilized Handheld)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080c12; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    #scene { position: fixed; inset: 0; }
    #status {
      position: fixed; left: 22px; bottom: 18px; z-index: 2;
      color: rgba(238,245,255,.7); font-size: 11px; letter-spacing: .2em;
      text-transform: uppercase; pointer-events: none;
    }
    #export-ui {
      position: fixed; top: 18px; right: 22px; z-index: 4;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      background: rgba(16, 21, 29, 0.88); border: 1px solid rgba(255,255,255,0.14);
      padding: 10px 14px; border-radius: 10px; backdrop-filter: blur(8px);
      font-size: 12px; color: #eef5ff;
    }
    #export-ui button, #export-ui select, #export-ui label, #export-ui input {
      font: inherit; color: inherit;
    }
    #export-ui select, #export-ui input[type="range"] {
      background: #182232; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; padding: 4px 6px;
    }
    .btn {
      background: #2b72ff; border: none; border-radius: 6px;
      padding: 6px 12px; font-weight: 600; cursor: pointer; color: #fff;
    }
    .btn.secondary { background: #2c3a4f; }
    .btn.recording { background: #e53935; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    #loader-banner {
      position: fixed; left: 22px; top: 18px; z-index: 4;
      background: rgba(16, 21, 29, 0.9); border: 1px solid rgba(255,255,255,0.14);
      padding: 10px 14px; border-radius: 10px; color: #b8c7dc;
      font: 12px/1.5 ui-monospace, monospace; max-width: 460px;
    }
    #fileInput { display: none; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div id="status">3D Marketing · NovaTrix Media</div>
  <div id="loader-banner">Initializing 3D engine...</div>

  <div id="export-ui">
    <input type="file" id="fileInput" accept=".glb,.gltf">
    <button id="pickModelBtn" class="btn secondary" title="Load subaru-wrx-sti.glb from your computer">
      Load .GLB File
    </button>
    <label title="Smooths out high-frequency hand tremors">
      Stabilization: <input type="range" id="stabilizeRange" min="0" max="1" step="0.05" value="0.75" style="width: 75px;">
    </label>
    <label>
      <input type="checkbox" id="watermarkToggle" checked>
      Watermark
    </label>
    <select id="durationSelect" title="Clip Duration">
      <option value="8.0">8.0s</option>
      <option value="10.4">10.4s</option>
    </select>
    <button id="recordBtn" class="btn" disabled>Waiting for Model...</button>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

    const DEFAULT_MODEL_URL = "./models/2006_subaru/subaru-wrx-sti.glb";
    const banner = document.querySelector("#loader-banner");
    const recordBtn = document.querySelector("#recordBtn");
    const pickModelBtn = document.querySelector("#pickModelBtn");
    const fileInput = document.querySelector("#fileInput");
    const durationSelect = document.querySelector("#durationSelect");
    const watermarkToggle = document.querySelector("#watermarkToggle");
    const stabilizeRange = document.querySelector("#stabilizeRange");

    const setBanner = (msg, isError = false) => {
      banner.style.display = "block";
      banner.style.borderColor = isError ? "rgba(255, 82, 82, 0.6)" : "rgba(255,255,255,0.14)";
      banner.style.color = isError ? "#ff9e9e" : "#b8c7dc";
      banner.textContent = msg;
    };

    const host = document.querySelector("#scene");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080c12);
    scene.fog = new THREE.Fog(0x080c12, 11, 38);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 120);
    camera.position.set(0.25, 1.35, 6.5);
    camera.lookAt(0, 0.6, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    host.appendChild(renderer.domElement);

    const exportCanvas = document.createElement("canvas");
    const exportCtx = exportCanvas.getContext("2d");

    scene.add(new THREE.HemisphereLight(0xc9ddff, 0x1a202b, 2.2));
    const key = new THREE.DirectionalLight(0xffffff, 3.2);
    key.position.set(-4, 8, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x428cff, 2.2);
    rim.position.set(4, 3, -5);
    scene.add(rim);

    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x171d26, roughness: 0.76, metalness: 0.18
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.025;
    floor.receiveShadow = true;
    scene.add(floor);

    const laneMat = new THREE.MeshBasicMaterial({ color: 0x293747, transparent: true, opacity: 0.72 });
    for (let i = -3; i <= 3; i++) {
      for (let z = -12; z <= 4; z += 3.2) {
        const mark = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.003, 1.1), laneMat);
        mark.position.set(i * 1.15, -0.006, z);
        scene.add(mark);
      }
    }

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enabled = false;

    const loader = new GLTFLoader();
    if (MeshoptDecoder) {
      if (MeshoptDecoder.ready) await MeshoptDecoder.ready;
      loader.setMeshoptDecoder(MeshoptDecoder);
    }
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath("https://www.gstatic.com/draco/versioned/decoders/1.5.7/");
    loader.setDRACOLoader(dracoLoader);

    let carRoot = null;
    let carModel = null;
    let wheels = [];
    let headlightMeshes = [];
    let beamL = null, beamR = null;
    let carSize = new THREE.Vector3(2, 1.4, 4.4);
    let carLength = 4.4;
    let approachStart = performance.now();
    let modelReady = false;
    let frontSign = 1;
    const clock = new THREE.Clock();

    const currentCameraPos = new THREE.Vector3(0, 1.35, 6.5);
    const currentLookTarget = new THREE.Vector3(0, 0.6, -5);
    const desiredLookTarget = new THREE.Vector3(0, 0.6, -5);

    function setHeadlights(on) {
      for (const mat of headlightMeshes) {
        const name = (mat.name || "").toLowerCase();
        if (!/(light|lamp|head|led|emissive|glow|glass_front)/i.test(name)) continue;
        if (mat.emissive) mat.emissive.set(on ? 0xfff6e5 : 0x000000);
        if ("emissiveIntensity" in mat) mat.emissiveIntensity = on ? 6.5 : 0;
      }
      if (beamL && beamR) {
        beamL.intensity = on ? 22 : 0;
        beamR.intensity = on ? 22 : 0;
      }
    }

    function setupLoadedGLTF(gltf, sourceLabel) {
      if (carRoot) scene.remove(carRoot);
      wheels = [];
      headlightMeshes = [];

      carRoot = new THREE.Group();
      carModel = gltf.scene;
      carRoot.add(carModel);
      scene.add(carRoot);

      carModel.traverse((obj) => {
        const name = (obj.name || "").toLowerCase();
        if (name.includes("wheel") || name.includes("tire") || name.includes("tyre") || name.includes("rim")) {
          wheels.push(obj);
        }
        if (!obj.isMesh) return;
        obj.castShadow = true;
        obj.receiveShadow = true;
        if (obj.material) {
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          for (const mat of mats) {
            if (!headlightMeshes.includes(mat)) headlightMeshes.push(mat);
          }
        }
      });

      carModel.updateMatrixWorld(true);
      let bounds = new THREE.Box3().setFromObject(carModel);
      let size = bounds.getSize(new THREE.Vector3());
      const maxDimension = Math.max(size.x, size.y, size.z);

      const normalizationScale = 5 / maxDimension;
      carModel.scale.multiplyScalar(normalizationScale);
      carModel.updateMatrixWorld(true);

      bounds = new THREE.Box3().setFromObject(carModel);
      size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());

      carModel.position.set(-center.x, -bounds.min.y, -center.z);
      carModel.updateMatrixWorld(true);

      carSize.copy(size);
      carLength = Math.max(size.x, size.z);
      frontSign = 1;

      const createHeadlightBeam = (xOffset) => {
        const spot = new THREE.SpotLight(0xfff4dd, 0, 22, Math.PI / 5, 0.55, 1.4);
        spot.position.set(xOffset, size.y * 0.46, frontSign * (size.z * 0.46));
        spot.target.position.set(xOffset * 1.15, -0.02, frontSign * (size.z * 2.8));
        carRoot.add(spot);
        carRoot.add(spot.target);
        return spot;
      };
      beamL = createHeadlightBeam(-size.x * 0.34);
      beamR = createHeadlightBeam(size.x * 0.34);

      approachStart = performance.now();
      clock.start();
      modelReady = true;

      recordBtn.disabled = false;
      recordBtn.textContent = "Restart & Export Video";
      setBanner(`Loaded: ${sourceLabel}`);
      setTimeout(() => { banner.style.display = "none"; }, 3500);
    }

    function loadModelFromUrl(url, label = url) {
      setBanner(`Loading ${label}...`);
      loader.load(
        url,
        (gltf) => setupLoadedGLTF(gltf, label),
        (xhr) => {
          if (xhr.total > 0) setBanner(`Loading ${label}... ${Math.round((xhr.loaded / xhr.total) * 100)}%`);
        },
        (err) => {
          setBanner("Could not auto-load model. Click 'Load .GLB File' to pick it manually.", true);
        }
      );
    }

    pickModelBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (file) loadModelFromUrl(URL.createObjectURL(file), file.name);
    });

    loadModelFromUrl(DEFAULT_MODEL_URL, "subaru-wrx-sti.glb");

    function smoothstep(t) {
      const c = Math.max(0, Math.min(1, t));
      return c * c * (3 - 2 * c);
    }

    // Stabilized Handheld Camera Rig with configurable virtual gimbal damping
    function updateHandheldCamera(elapsed, delta, carZ, approachProgress, headlightsOn) {
      const stab = parseFloat(stabilizeRange.value) || 0.75; // 0 = raw human, 1 = tripod smooth

      const crouchPhase = smoothstep((approachProgress - 0.15) / 0.85);
      const baseX = 0.22 + 0.36 * crouchPhase;
      const baseY = THREE.MathUtils.lerp(1.42, Math.max(0.72, carSize.y * 0.48), crouchPhase);
      const baseZ = frontSign * (carSize.z * 1.38 + 0.35 * crouchPhase);

      // Dampen breathing and tremors based on stabilization slider
      const noiseMultiplier = 1.0 - (stab * 0.82);
      const breathY = (Math.sin(elapsed * 1.75) * 0.014 + Math.sin(elapsed * 0.85) * 0.008) * noiseMultiplier;
      const swayX = (Math.sin(elapsed * 1.1) * 0.022) * noiseMultiplier;
      const swayZ = (Math.cos(elapsed * 1.4) * 0.012) * noiseMultiplier;

      // Engine rumble vibration scaled down by stabilization
      const proximity = smoothstep((approachProgress - 0.5) / 0.5);
      const rumbleIntensity = proximity * (approachProgress < 0.99 ? 0.0045 : 0.001) * (1.0 - stab * 0.9);
      const rumbleX = (Math.sin(elapsed * 37.0)) * rumbleIntensity;
      const rumbleY = (Math.cos(elapsed * 43.0)) * rumbleIntensity;

      const targetPosX = baseX + swayX + rumbleX;
      const targetPosY = baseY + breathY + rumbleY;
      const targetPosZ = baseZ + swayZ;

      // Virtual Gimbal Damping (Exponential smoothing for position)
      const posDamping = THREE.MathUtils.lerp(5.0, 18.0, stab);
      currentCameraPos.lerp(new THREE.Vector3(targetPosX, targetPosY, targetPosZ), 1 - Math.exp(-posDamping * delta));
      camera.position.copy(currentCameraPos);

      // LookAt Target smoothing
      const focusZ = THREE.MathUtils.lerp(carZ + frontSign * (carLength * 0.28), 0.35, crouchPhase * 0.55);
      desiredLookTarget.set(
        Math.sin(elapsed * 1.6) * (0.03 * noiseMultiplier),
        Math.max(0.45, carSize.y * 0.34) + Math.cos(elapsed * 2.1) * (0.015 * noiseMultiplier),
        focusZ
      );

      const lookDamping = THREE.MathUtils.lerp(6.0, 22.0, stab);
      currentLookTarget.lerp(desiredLookTarget, 1 - Math.exp(-lookDamping * delta));
      camera.lookAt(currentLookTarget);

      // Roll stabilization
      const handheldRoll = Math.sin(elapsed * 1.3) * (0.01 * (1.0 - stab));
      camera.rotation.z += handheldRoll;

      const targetExposure = headlightsOn ? 0.96 : 1.15;
      renderer.toneMappingExposure = THREE.MathUtils.lerp(
        renderer.toneMappingExposure,
        targetExposure,
        1 - Math.exp(-10 * delta)
      );
    }

    function stepScene(elapsed, delta) {
      if (modelReady && carRoot) {
        const approachDuration = 4.6;
        const t = Math.min(elapsed / approachDuration, 1);
        const eased = smoothstep(t);
        const startZ = -Math.max(10.5, carLength * 2.4);
        const stopZ = 0.4;
        const currentCarZ = startZ + (stopZ - startZ) * eased;
        carRoot.position.z = currentCarZ;

        const brakeWindow = Math.sin(smoothstep((t - 0.62) / 0.38) * Math.PI);
        const idleVibration = Math.sin(elapsed * 48) * 0.0012;
        carModel.rotation.x = brakeWindow * 0.024 + idleVibration;

        const moving = t < 0.992;
        const spinRate = moving ? 9.2 * (1 - 0.85 * t * t) : 0;
        for (const wheel of wheels) {
          wheel.rotation.x += spinRate * delta;
        }

        const sinceStop = elapsed - approachDuration;
        let lightsOn = false;
        if (sinceStop >= 0) {
          const cycle = sinceStop % 2.4;
          lightsOn = cycle < 0.35 || (cycle > 0.65 && cycle < 1.0);
        }
        setHeadlights(lightsOn);

        updateHandheldCamera(elapsed, delta, currentCarZ, t, lightsOn);
      }

      renderer.render(scene, camera);
    }

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    function syncExportCanvas() {
      const src = renderer.domElement;
      if (exportCanvas.width !== src.width || exportCanvas.height !== src.height) {
        exportCanvas.width = src.width;
        exportCanvas.height = src.height;
      }
      exportCtx.drawImage(src, 0, 0);

      if (watermarkToggle.checked) {
        const scale = src.width / innerWidth;
        exportCtx.save();
        exportCtx.font = `${Math.round(11 * scale)}px system-ui, -apple-system, Segoe UI, sans-serif`;
        exportCtx.fillStyle = "rgba(238, 245, 255, 0.72)";
        if ("letterSpacing" in exportCtx) exportCtx.letterSpacing = `${2.2 * scale}px`;
        exportCtx.fillText("3D MARKETING · NOVATRIX MEDIA", 22 * scale, src.height - 18 * scale);
        exportCtx.restore();
      }
    }

    function pickSupportedMimeType() {
      const candidates = ["video/mp4;codecs=avc1.42E01E", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
      return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function startExportRecording() {
      if (!modelReady || isRecording) return;

      approachStart = performance.now();
      clock.getDelta();
      currentLookTarget.set(0, 0.6, -10);
      currentCameraPos.set(0.25, 1.35, 6.5);

      syncExportCanvas();
      const stream = exportCanvas.captureStream(60);
      const mimeType = pickSupportedMimeType();
      recordedChunks = [];

      mediaRecorder = new MediaRecorder(stream, {
        ...(mimeType ? { mimeType } : {}),
        videoBitsPerSecond: 25_000_000
      });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const finalType = mediaRecorder.mimeType || "video/webm";
        const ext = finalType.includes("mp4") ? "mp4" : "webm";
        const blob = new Blob(recordedChunks, { type: finalType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `novatrix-subaru-stabilized.${ext}`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000);

        isRecording = false;
        recordBtn.classList.remove("recording");
        recordBtn.textContent = "Restart & Export Video";
      };

      mediaRecorder.start(100);
      isRecording = true;
      recordBtn.classList.add("recording");
    }

    recordBtn.addEventListener("click", () => {
      if (isRecording) mediaRecorder.stop();
      else startExportRecording();
    });

    function animate(now) {
      requestAnimationFrame(animate);
      const elapsed = (now - approachStart) / 1000;
      const delta = Math.min(clock.getDelta(), 0.04);

      stepScene(elapsed, delta);

      if (isRecording) {
        syncExportCanvas();
        const targetDuration = parseFloat(durationSelect.value) || 8.0;
        const remaining = Math.max(0, targetDuration - elapsed);
        recordBtn.textContent = `Recording... ${remaining.toFixed(1)}s (Stop)`;
        if (elapsed >= targetDuration) mediaRecorder.stop();
      }
    }
    requestAnimationFrame(animate);

    window.__renderAtTime = (elapsedSeconds, dt = 1 / 60) => {
      stepScene(elapsedSeconds, dt);
      syncExportCanvas();
    };
    window.__isModelReady = () => modelReady;

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
