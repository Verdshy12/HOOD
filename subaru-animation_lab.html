<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D Marketing — NovaTrix Media (Handheld + Video Exporter)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080c12; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    #scene { position: fixed; inset: 0; }
    #status {
      position: fixed; left: 22px; bottom: 18px; z-index: 2;
      color: rgba(238,245,255,.7); font-size: 11px; letter-spacing: .2em;
      text-transform: uppercase; pointer-events: none;
    }
    #export-ui {
      position: fixed; top: 18px; right: 22px; z-index: 4;
      display: flex; gap: 10px; align-items: center;
      background: rgba(16, 21, 29, 0.85); border: 1px solid rgba(255,255,255,0.14);
      padding: 10px 14px; border-radius: 10px; backdrop-filter: blur(8px);
      font-size: 12px; color: #eef5ff;
    }
    #export-ui button, #export-ui select, #export-ui label {
      font: inherit; color: inherit;
    }
    #export-ui select {
      background: #182232; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; padding: 5px 8px;
    }
    #export-ui button {
      background: #2b72ff; border: none; border-radius: 6px;
      padding: 6px 12px; font-weight: 600; cursor: pointer;
    }
    #export-ui button.recording { background: #e53935; }
    #export-ui button:disabled { opacity: 0.5; cursor: not-allowed; }
    #error {
      display: none; position: fixed; inset: 0; padding: 28px;
      color: #fff; background: #10151d; white-space: pre-wrap; overflow: auto;
      font: 14px/1.6 ui-monospace, monospace; z-index: 5;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div id="scene"></div>
  <div id="status">3D Marketing · NovaTrix Media</div>

  <div id="export-ui">
    <label>
      <input type="checkbox" id="watermarkToggle" checked>
      Watermark
    </label>
    <select id="durationSelect" title="Clip Duration">
      <option value="8.0">8.0s (Approach + 2 Flashes)</option>
      <option value="10.4">10.4s (Approach + 3 Flashes)</option>
    </select>
    <button id="recordBtn" disabled>Loading Model...</button>
  </div>

  <pre id="error"></pre>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";

    const MODEL_URL = "./models/2006_subaru/subaru-wrx-sti.glb";
    const errorBox = document.querySelector("#error");
    const recordBtn = document.querySelector("#recordBtn");
    const durationSelect = document.querySelector("#durationSelect");
    const watermarkToggle = document.querySelector("#watermarkToggle");

    const showError = (error) => {
      console.error(error);
      errorBox.style.display = "block";
      errorBox.textContent = "The Subaru showcase could not start.\n\n" +
        (error?.stack || error?.message || String(error)) +
        "\n\nCheck that this HTML file is in the v1.2.1 project root and that the model and vendor files exist.";
    };

    try {
      const host = document.querySelector("#scene");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x080c12);
      scene.fog = new THREE.Fog(0x080c12, 11, 38);

      // 42mm-equivalent human perspective FOV
      const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 120);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        preserveDrawingBuffer: true
      });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      host.appendChild(renderer.domElement);

      // Composite 2D canvas used for recording (combines 3D WebGL + optional watermark)
      const exportCanvas = document.createElement("canvas");
      const exportCtx = exportCanvas.getContext("2d");

      scene.add(new THREE.HemisphereLight(0xc9ddff, 0x1a202b, 2.0));
      const key = new THREE.DirectionalLight(0xffffff, 3.0);
      key.position.set(-4, 8, 5);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      scene.add(key);

      const rim = new THREE.DirectionalLight(0x428cff, 2.2);
      rim.position.set(4, 3, -5);
      scene.add(rim);

      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x171d26, roughness: 0.76, metalness: 0.18
      });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.025;
      floor.receiveShadow = true;
      scene.add(floor);

      const laneMat = new THREE.MeshBasicMaterial({ color: 0x293747, transparent: true, opacity: 0.72 });
      for (let i = -3; i <= 3; i++) {
        for (let z = -12; z <= 4; z += 3.2) {
          const mark = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.003, 1.1), laneMat);
          mark.position.set(i * 1.15, -0.006, z);
          scene.add(mark);
        }
      }

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enabled = false;

      const loader = new GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);

      let carRoot, carModel, wheels = [];
      let headlightMeshes = [];
      let beamL, beamR;
      let carSize = new THREE.Vector3(2, 1.4, 4.4);
      let carLength = 4.4;
      let approachStart = performance.now();
      let modelReady = false;
      let frontSign = 1;
      const clock = new THREE.Clock();

      // Smoothed camera lookAt target to simulate human neck/wrist tracking lag
      const currentLookTarget = new THREE.Vector3(0, 0.6, -5);
      const desiredLookTarget = new THREE.Vector3(0, 0.6, -5);

      function setHeadlights(on) {
        for (const mat of headlightMeshes) {
          const name = (mat.name || "").toLowerCase();
          if (!/(light|lamp|head|led|emissive|glow)/i.test(name)) continue;

          if (!mat.userData.originalEmissive) {
            mat.userData.originalEmissive = mat.emissive
              ? mat.emissive.clone()
              : new THREE.Color(0x000000);
          }
          if (mat.emissive) {
            mat.emissive.set(on ? 0xfff6e5 : 0x000000);
          }
          if ("emissiveIntensity" in mat) {
            mat.emissiveIntensity = on ? 6.5 : 0;
          }
        }
        if (beamL && beamR) {
          beamL.intensity = on ? 22 : 0;
          beamR.intensity = on ? 22 : 0;
        }
      }

      loader.load(MODEL_URL, (gltf) => {
        carRoot = new THREE.Group();
        carModel = gltf.scene;
        carRoot.add(carModel);
        scene.add(carRoot);

        carModel.traverse((obj) => {
          const name = obj.name.toLowerCase();
          if (name.includes("wheel") || name.includes("tire") || name.includes("tyre")) {
            wheels.push(obj);
          }
          if (!obj.isMesh) return;
          obj.castShadow = true;
          obj.receiveShadow = true;

          if (obj.material) {
            const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
            for (const mat of mats) {
              if (!headlightMeshes.includes(mat)) headlightMeshes.push(mat);
            }
          }
        });

        carModel.updateMatrixWorld(true);
        let bounds = new THREE.Box3().setFromObject(carModel);
        let size = bounds.getSize(new THREE.Vector3());
        const maxDimension = Math.max(size.x, size.y, size.z);

        if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
          showError(new Error("Subaru model has invalid or empty geometry."));
          return;
        }

        const normalizationScale = 5 / maxDimension;
        carModel.scale.multiplyScalar(normalizationScale);
        carModel.updateMatrixWorld(true);

        bounds = new THREE.Box3().setFromObject(carModel);
        size = bounds.getSize(new THREE.Vector3());
        const center = bounds.getCenter(new THREE.Vector3());

        // Ensure car sits centered and flush with the ground
        carModel.position.set(-center.x, -bounds.min.y, -center.z);
        carModel.updateMatrixWorld(true);

        carSize.copy(size);
        carLength = Math.max(size.x, size.z);
        frontSign = 1;

        // Add real physical headlight beams attached to the car so flashing lights hit the ground
        const createHeadlightBeam = (xOffset) => {
          const spot = new THREE.SpotLight(0xfff4dd, 0, 22, Math.PI / 5, 0.55, 1.4);
          spot.position.set(xOffset, size.y * 0.46, frontSign * (size.z * 0.46));
          spot.target.position.set(xOffset * 1.15, -0.02, frontSign * (size.z * 2.8));
          carRoot.add(spot);
          carRoot.add(spot.target);
          return spot;
        };
        beamL = createHeadlightBeam(-size.x * 0.34);
        beamR = createHeadlightBeam(size.x * 0.34);

        approachStart = performance.now();
        clock.start();
        modelReady = true;

        recordBtn.disabled = false;
        recordBtn.textContent = "Restart & Export Video";
      }, undefined, showError);

      function smoothstep(t) {
        const c = Math.max(0, Math.min(1, t));
        return c * c * (3 - 2 * c);
      }

      // First-person handheld camera rig: simulates a real videographer in the scene
      function updateHandheldCamera(elapsed, delta, carZ, approachProgress, headlightsOn) {
        // 1. Videographer body placement:
        // Starts slightly off-center standing (1.42m high), steps slightly aside and crouches
        // to a dramatic automotive angle (0.82m high) as the car pulls up close.
        const crouchPhase = smoothstep((approachProgress - 0.15) / 0.85);
        const baseX = 0.22 + 0.36 * crouchPhase;
        const baseY = THREE.MathUtils.lerp(1.42, Math.max(0.72, carSize.y * 0.48), crouchPhase);
        const baseZ = frontSign * (carSize.z * 1.38 + 0.35 * crouchPhase);

        // 2. Human breathing + footstep weight transfer + wrist micro-jitter
        const breathY = Math.sin(elapsed * 1.75) * 0.014 + Math.sin(elapsed * 0.85) * 0.008;
        const swayX = Math.sin(elapsed * 1.1) * 0.022 + Math.cos(elapsed * 2.3) * 0.006;
        const swayZ = Math.cos(elapsed * 1.4) * 0.012;

        // 3. Engine/exhaust proximity vibration as the car nears the camera
        const proximity = smoothstep((approachProgress - 0.5) / 0.5);
        const rumbleIntensity = proximity * (approachProgress < 0.99 ? 0.0055 : 0.0018);
        const rumbleX = (Math.sin(elapsed * 37.0) + Math.cos(elapsed * 53.0)) * rumbleIntensity;
        const rumbleY = (Math.cos(elapsed * 43.0) + Math.sin(elapsed * 61.0)) * rumbleIntensity;

        camera.position.set(
          baseX + swayX + rumbleX,
          baseY + breathY + rumbleY,
          baseZ + swayZ
        );

        // 4. Natural human gaze tracking (follows the front badge/hood of the approaching car)
        const focusZ = THREE.MathUtils.lerp(carZ + frontSign * (carLength * 0.28), 0.35, crouchPhase * 0.55);
        desiredLookTarget.set(
          Math.sin(elapsed * 1.6) * 0.03,
          Math.max(0.45, carSize.y * 0.34) + Math.cos(elapsed * 2.1) * 0.015,
          focusZ
        );

        // Human wrist/neck tracking lag
        const trackingSpeed = 6.5;
        currentLookTarget.lerp(desiredLookTarget, 1 - Math.exp(-trackingSpeed * delta));
        camera.lookAt(currentLookTarget);

        // 5. Subtle handheld Dutch-angle roll (horizon tilt from holding a camera)
        const handheldRoll =
          Math.sin(elapsed * 1.3) * 0.012 +
          Math.cos(elapsed * 2.9) * 0.005 +
          Math.sin(elapsed * 41.0) * (rumbleIntensity * 0.8);
        camera.rotation.z += handheldRoll;

        // 6. Real camera auto-exposure dip when high beams flash into the lens
        const targetExposure = headlightsOn ? 0.96 : 1.15;
        renderer.toneMappingExposure = THREE.MathUtils.lerp(
          renderer.toneMappingExposure,
          targetExposure,
          1 - Math.exp(-10 * delta)
        );
      }

      // Deterministic or real-time step function
      function stepScene(elapsed, delta) {
        if (modelReady && carRoot) {
          const approachDuration = 4.6;
          const t = Math.min(elapsed / approachDuration, 1);
          const eased = smoothstep(t);
          const startZ = -Math.max(10.5, carLength * 2.4);
          const stopZ = 0.4;
          const currentCarZ = startZ + (stopZ - startZ) * eased;
          carRoot.position.z = currentCarZ;

          // Realistic suspension brake dive as the car decelerates to a halt, plus engine idle vibration
          const brakeWindow = Math.sin(smoothstep((t - 0.62) / 0.38) * Math.PI);
          const idleVibration = Math.sin(elapsed * 48) * 0.0012;
          carModel.rotation.x = brakeWindow * 0.024 + idleVibration;

          // Spin wheels proportional to movement speed
          const moving = t < 0.992;
          const spinRate = moving ? 9.2 * (1 - 0.85 * t * t) : 0;
          for (const wheel of wheels) {
            wheel.rotation.x += spinRate * delta;
          }

          const sinceStop = elapsed - approachDuration;
          let lightsOn = false;
          if (sinceStop >= 0) {
            const cycle = sinceStop % 2.4;
            lightsOn = cycle < 0.35 || (cycle > 0.65 && cycle < 1.0);
          }
          setHeadlights(lightsOn);

          updateHandheldCamera(elapsed, delta, currentCarZ, t, lightsOn);
        }

        renderer.render(scene, camera);
      }

      // Video Recording State
      let mediaRecorder = null;
      let recordedChunks = [];
      let isRecording = false;

      function syncExportCanvas() {
        const src = renderer.domElement;
        if (exportCanvas.width !== src.width || exportCanvas.height !== src.height) {
          exportCanvas.width = src.width;
          exportCanvas.height = src.height;
        }
        exportCtx.drawImage(src, 0, 0);

        if (watermarkToggle.checked) {
          const scale = src.width / innerWidth;
          exportCtx.save();
          exportCtx.font = `${Math.round(11 * scale)}px system-ui, -apple-system, Segoe UI, sans-serif`;
          exportCtx.fillStyle = "rgba(238, 245, 255, 0.72)";
          if ("letterSpacing" in exportCtx) {
            exportCtx.letterSpacing = `${2.2 * scale}px`;
          }
          exportCtx.fillText("3D MARKETING · NOVATRIX MEDIA", 22 * scale, src.height - 18 * scale);
          exportCtx.restore();
        }
      }

      function pickSupportedMimeType() {
        const candidates = [
          "video/mp4;codecs=avc1.42E01E",
          "video/mp4",
          "video/webm;codecs=vp9",
          "video/webm;codecs=vp8",
          "video/webm"
        ];
        return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
      }

      function startExportRecording() {
        if (!modelReady || isRecording) return;

        // Reset animation to t = 0
        approachStart = performance.now();
        clock.getDelta();
        currentLookTarget.set(0, 0.6, -10);

        syncExportCanvas();
        const stream = exportCanvas.captureStream(60);
